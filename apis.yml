aid: dehaat
name: DeHaat
description: 'DeHaat (Green Agrevolution Private Limited) is one of India''s largest full-stack
  agritech platforms, connecting smallholder farmers from "seed to market" through a phygital network
  of 11,000+ DeHaat Centres and 503 Farmer Producer Organisations across 12+ agrarian states. Founded
  in 2012 by IIT/IIM alumni, the platform serves 1.8 million+ farmers with agri-inputs (seeds,
  fertilizers, crop protection), AI-enabled crop advisory in multiple regional languages for 30+ crops,
  soil analysis, crop-health monitoring, market linkage for harvested produce, and agri-financing.
  Backed by Prosus Ventures and others, DeHaat operates a franchisee micro-entrepreneur model that
  raises farmer net incomes 30-50% while making procurement more predictable for buyers. This profile
  was surfaced as a portfolio company of prosus-ventures; the company publishes no public developer
  API portal or OpenAPI at this time, so enrichment is limited to identity, corporate link-properties,
  and security posture.'
